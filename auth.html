<!DOCTYPE html>
<!-- Retorno do login do Lichess na web (I05c): devolve o endereço à janela
     do iCan, que troca o código pelo token. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>iCan · Lichess conectado</title>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 15%">
  <p>Pronto! Se esta janela não fechar sozinha, feche e volte para o iCan.</p>
  <script>
    function postAuthenticationMessage() {
      const message = {
        'flutter-web-auth-2': window.location.href
      };
      if (window.opener) {
        window.opener.postMessage(message, window.location.origin);
        window.close();
      } else if (window.parent && window.parent !== window) {
        window.parent.postMessage(message, window.location.origin);
      } else {
        localStorage.setItem('flutter-web-auth-2', window.location.href);
        window.close();
      }
    }
    postAuthenticationMessage();
  </script>
</body>
</html>
